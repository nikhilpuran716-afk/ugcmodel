<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" fill="none">
  <defs>
    <linearGradient id="studioPlaster" x1="0" y1="0" x2="720" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8F5F0" />
      <stop offset="60%" stop-color="#EDE5DA" />
      <stop offset="100%" stop-color="#DFD3C4" />
    </linearGradient>
    <linearGradient id="crimsonSilk" x1="220" y1="280" x2="520" y2="1020" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C42B3C" />
      <stop offset="45%" stop-color="#A52332" />
      <stop offset="100%" stop-color="#6E141F" />
    </linearGradient>
    <linearGradient id="silkFold" x1="340" y1="450" x2="490" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8A1A27" />
      <stop offset="100%" stop-color="#4F0B13" />
    </linearGradient>
    <filter id="drapeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="16" dy="26" stdDeviation="22" flood-color="#3A1A1E" flood-opacity="0.22" />
    </filter>
  </defs>

  <rect width="720" height="1280" fill="url(#studioPlaster)" />

  <!-- Architectural Arch Backdrop -->
  <path d="M130 1050 L130 430 A230 230 0 0 1 590 430 L590 1050 Z" fill="#FBF9F6" stroke="#E2D8CA" stroke-width="2" />

  <!-- Editorial Dress Silhouette on Tailored Form -->
  <g filter="url(#drapeShadow)">
    <!-- Minimalist Brass Stand Pole -->
    <line x1="360" y1="210" x2="360" y2="1060" stroke="#B89968" stroke-width="5" />
    <ellipse cx="360" cy="1060" rx="85" ry="16" fill="#B89968" />

    <!-- Tailored Bust Form -->
    <path d="M312 260 Q360 245 408 260 L418 330 Q360 340 302 330 Z" fill="#E8DFD2" stroke="#D1C4B2" stroke-width="1.5" />

    <!-- Velmora Crimson Midi Dress Silhouette & Flowing Movement -->
    <path d="M312 275 L335 335 L385 335 L408 275 L430 415 Q485 680 545 920 Q450 965 360 945 Q265 975 185 910 Q255 660 290 415 Z" fill="url(#crimsonSilk)" />

    <!-- Sculptural Pleats & Fabric Movement Folds -->
    <path d="M345 415 Q330 680 285 940 L355 945 Q365 680 365 415 Z" fill="url(#silkFold)" opacity="0.65" />
    <path d="M395 415 Q435 670 495 935 L435 950 Q395 680 375 415 Z" fill="url(#silkFold)" opacity="0.5" />

    <!-- Waist Seam -->
    <path d="M290 415 Q360 428 430 415" stroke="#6E141F" stroke-width="3" fill="none" />
  </g>

  <!-- Editorial Caption Stamp inside Frame -->
  <text x="360" y="1145" text-anchor="middle" fill="#6F6B67" font-family="serif" font-style="italic" font-size="22">Velmora — Silhouette &amp; Motion Study</text>

  <rect x="36" y="36" width="648" height="1208" rx="16" stroke="#171717" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
