<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1280" width="720" height="1280" fill="none">
  <defs>
    <linearGradient id="fragranceBg" x1="0" y1="0" x2="720" y2="1280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFE8DE" />
      <stop offset="50%" stop-color="#DFD3C3" />
      <stop offset="100%" stop-color="#C9B9A6" />
    </linearGradient>
    <linearGradient id="amberJuice" x1="230" y1="490" x2="490" y2="910" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8B882" stop-opacity="0.82" />
      <stop offset="55%" stop-color="#C98A4B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#9A5B25" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="goldBand" x1="310" y1="410" x2="410" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F5DFB0" />
      <stop offset="50%" stop-color="#C9A259" />
      <stop offset="100%" stop-color="#8F6B29" />
    </linearGradient>
    <filter id="luxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="24" dy="32" stdDeviation="26" flood-color="#3E2E1E" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- Warm Limestone Background -->
  <rect width="720" height="1280" fill="url(#fragranceBg)" />

  <!-- Golden Hour Shadow Geometry -->
  <polygon points="0,0 440,0 160,1280 0,1280" fill="#FFFDF9" fill-opacity="0.38" />
  <polygon points="480,0 720,0 720,1280 280,1280" fill="#2A211B" fill-opacity="0.06" />

  <!-- Architectural Plinth -->
  <rect x="110" y="930" width="500" height="180" rx="4" fill="#E5DACB" stroke="#CBBBA6" stroke-width="1.5" />
  <polygon points="110,930 170,890 640,890 610,930" fill="#F2EAE0" />

  <!-- Faceted Luxury Perfume Flacon -->
  <g filter="url(#luxShadow)">
    <!-- Faceted Emerald-Cut Glass Stopper -->
    <polygon points="315,285 405,285 425,310 425,375 405,395 315,395 295,375 295,310" fill="#FFFDF9" fill-opacity="0.86" stroke="#D1C2B0" stroke-width="2" />
    <rect x="315" y="305" width="90" height="70" fill="#F3ECE2" fill-opacity="0.6" stroke="#DED2C3" stroke-width="1" />

    <!-- Gold Neck Band -->
    <rect x="322" y="395" width="76" height="52" rx="2" fill="url(#goldBand)" />
    <rect x="330" y="408" width="60" height="26" fill="#FFFFFF" stroke="#C9A259" stroke-width="1" />

    <!-- Outer Beveled Crystal Flacon -->
    <rect x="206" y="447" width="308" height="456" rx="8" fill="#FFFDF9" fill-opacity="0.9" stroke="#CBBBA7" stroke-width="2.5" />
    <!-- Bevel Lines -->
    <line x1="206" y1="447" x2="232" y2="475" stroke="#D5C6B4" stroke-width="1.5" />
    <line x1="514" y1="447" x2="488" y2="475" stroke="#D5C6B4" stroke-width="1.5" />
    <line x1="206" y1="903" x2="232" y2="875" stroke="#D5C6B4" stroke-width="1.5" />
    <line x1="514" y1="903" x2="488" y2="875" stroke="#D5C6B4" stroke-width="1.5" />

    <!-- Inner Amber Eau de Parfum Chamber -->
    <rect x="232" y="475" width="256" height="400" rx="4" fill="url(#amberJuice)" />

    <!-- Iconic Framed Label -->
    <rect x="266" y="555" width="188" height="175" fill="#FFFDF9" stroke="#C9A259" stroke-width="2.5" />
    <rect x="273" y="562" width="174" height="161" fill="none" stroke="#171717" stroke-width="1" />

    <text x="360" y="610" text-anchor="middle" fill="#171717" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="2.5">COCO</text>
    <text x="360" y="634" text-anchor="middle" fill="#171717" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="2">MADEMOISELLE</text>
    <line x1="325" y1="654" x2="395" y2="654" stroke="#C9A259" stroke-width="1.5" />
    <text x="360" y="680" text-anchor="middle" fill="#171717" font-family="serif" font-size="15" font-weight="600" letter-spacing="2">CHANEL</text>
    <text x="360" y="704" text-anchor="middle" fill="#6F6B67" font-family="sans-serif" font-size="9" letter-spacing="1.8">EAU DE PARFUM INTENSE</text>

    <!-- Specular Glass Highlights -->
    <rect x="242" y="485" width="14" height="380" fill="#FFFFFF" fill-opacity="0.35" />
  </g>

  <rect x="36" y="36" width="648" height="1208" rx="16" stroke="#171717" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
