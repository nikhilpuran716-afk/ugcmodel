<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" fill="none">
  <defs>
    <linearGradient id="portraitBg" x1="0" y1="0" x2="600" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4EFE8" />
      <stop offset="100%" stop-color="#E3D8C9" />
    </linearGradient>
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="12" dy="18" stdDeviation="16" flood-color="#171717" flood-opacity="0.12" />
    </filter>
  </defs>

  <rect width="600" height="800" fill="url(#portraitBg)" />

  <!-- Architectural Sunlight Slats -->
  <polygon points="0,120 600,290 600,430 0,260" fill="#FFFFFF" fill-opacity="0.5" />
  <polygon points="0,480 600,650 600,740 0,570" fill="#FFFFFF" fill-opacity="0.35" />

  <!-- Editorial Storyboard Cards & Cinema Viewfinder Still Life -->
  <g filter="url(#cardShadow)">
    <!-- Storyboard Sheet -->
    <rect x="110" y="150" width="320" height="440" rx="8" transform="rotate(-4 270 370)" fill="#FFFFFF" stroke="#DFD6C9" stroke-width="1.5" />
    <rect x="140" y="185" width="120" height="190" rx="4" transform="rotate(-4 270 370)" fill="#F8F6F2" stroke="#D5CBBF" stroke-width="1.5" />
    <rect x="276" y="185" width="120" height="190" rx="4" transform="rotate(-4 270 370)" fill="#F8F6F2" stroke="#D5CBBF" stroke-width="1.5" />
    <line x1="145" y1="415" x2="365" y2="400" stroke="#171717" stroke-width="2" stroke-opacity="0.7" />
    <line x1="147" y1="440" x2="325" y2="428" stroke="#6F6B67" stroke-width="1.5" stroke-opacity="0.5" />

    <!-- Foreground 9:16 Director Frame -->
    <rect x="220" y="210" width="260" height="450" rx="22" fill="#171717" />
    <rect x="232" y="222" width="236" height="426" rx="14" fill="#F8F6F2" />

    <!-- Minimalist Viewfinder Crosshairs inside Frame -->
    <line x1="350" y1="395" x2="350" y2="455" stroke="#A52332" stroke-width="1.5" />
    <line x1="320" y1="425" x2="380" y2="425" stroke="#A52332" stroke-width="1.5" />
    <rect x="262" y="255" width="32" height="3" fill="#171717" />
    <rect x="262" y="255" width="3" height="32" fill="#171717" />
    <rect x="406" y="255" width="32" height="3" fill="#171717" />
    <rect x="435" y="255" width="3" height="32" fill="#171717" />
    <rect x="262" y="592" width="32" height="3" fill="#171717" />
    <rect x="262" y="563" width="3" height="32" fill="#171717" />
    <rect x="406" y="592" width="32" height="3" fill="#171717" />
    <rect x="435" y="563" width="3" height="32" fill="#171717" />

    <text x="350" y="345" text-anchor="middle" fill="#171717" font-family="serif" font-size="22" font-weight="600">9:16 AD STUDIO</text>
    <text x="350" y="372" text-anchor="middle" fill="#6F6B67" font-family="sans-serif" font-size="11" letter-spacing="2">STORYBOARD &amp; AI MOTION</text>
    <text x="350" y="520" text-anchor="middle" fill="#A52332" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="1.8">FACELESS UGC STUDIO</text>
  </g>

  <rect x="28" y="28" width="544" height="744" rx="12" stroke="#171717" stroke-opacity="0.08" stroke-width="1.5" />
</svg>
